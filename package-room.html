<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JESTILO | Private Shipment Room</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f9;color:#18202a}.container{width:min(1100px,92%);margin:auto}header{background:#0b1724;color:#fff;padding:18px 0;position:sticky;top:0;z-index:20}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900}.logo span{color:#18a6a6}.back{color:#fff;text-decoration:none;font-size:13px;background:#168f9b;padding:10px 15px;border-radius:6px}.hero{background:linear-gradient(120deg,#0b1724,#123944);color:#fff;padding:45px 0}.eyebrow{color:#73d8d8;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:1px}.hero h1{margin:10px 0;font-size:clamp(32px,6vw,54px)}.hero p{color:#d7e1e6;line-height:1.6}.code{font-weight:bold;color:#73d8d8}.wrap{padding:35px 0}.card{background:#fff;border:1px solid #e1e6e9;border-radius:12px;padding:25px;margin-bottom:20px;box-shadow:0 8px 25px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.info{background:#f7f8f9;border-radius:8px;padding:16px}.info small{display:block;color:#77818a;margin-bottom:5px}.status{display:inline-block;background:#e9f8ef;color:#18733d;border-radius:20px;padding:8px 13px;font-weight:bold;font-size:13px}.package-img{width:100%;max-height:430px;object-fit:cover;border-radius:10px;margin-top:15px;display:block}.update{background:#eefafa;border:1px solid #cce8e8;border-radius:9px;padding:18px}.update p{margin:7px 0 0;line-height:1.6}.timeline-item{display:flex;gap:14px;margin:17px 0}.dot{width:15px;height:15px;border-radius:50%;background:#d1d6da;flex:none;margin-top:2px}.dot.active{background:#168f9b;box-shadow:0 0 0 5px #e5f7f7}.tltext strong{display:block}.tltext span{color:#77818a;font-size:13px}.mapbox{display:none}.map-summary{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#f7f8f9;padding:14px;border-radius:8px;flex-wrap:wrap;margin-bottom:14px}.point{flex:1;min-width:150px}.point small{display:block;color:#77818a;font-size:12px;margin-bottom:4px}.point strong{font-size:14px}.arrow{color:#168f9b;font-size:22px}#shipmentMap{height:420px;border-radius:10px;overflow:hidden}.map-status{color:#6d7780;font-size:13px;margin-top:10px}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.item{border:1px solid #dfe6e9;border-radius:14px;padding:20px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.06);min-width:0}.item img{width:100%;height:250px;object-fit:cover;border-radius:10px;background:#eef1f3;display:block;cursor:zoom-in}.item h3{margin:14px 0 9px;font-size:18px;line-height:1.35}.item p{margin:8px 0;color:#69747c;font-size:14px;line-height:1.55}.price{font-size:18px;font-weight:bold;color:#18202a}.support{position:relative;overflow:hidden}.support-ticker{display:flex;gap:26px;white-space:nowrap;overflow:hidden;background:#eefafa;color:#168f9b;border-radius:9px;padding:9px 12px;margin:0 0 13px;font-size:12px;font-weight:700}.support-ticker span{display:inline-block;animation:supportMove 16s linear infinite}@keyframes supportMove{from{transform:translateX(20%)}to{transform:translateX(-110%)}}.support a{display:inline-block;text-decoration:none;color:#fff;padding:11px 15px;border-radius:7px;margin:5px 7px 0 0}.wa{background:#25D366}.mail{background:#168f9b}.empty{color:#77818a;padding:10px 0}.loading{text-align:center;padding:60px 0}.error{background:#fff1f0;color:#b42318;border:1px solid #f0c9c5;border-radius:9px;padding:18px}.small{color:#77818a;font-size:13px}footer{background:#071019;color:#9ba5ad;padding:30px 0;text-align:center;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.items{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.hero{padding:35px 0}.card{padding:18px}#shipmentMap{height:330px}.head{gap:12px}.back{white-space:nowrap}}
</style></head>
<body>
<header><div class="container head"><div class="logo">JESTILO <span>Worldwide Delivery</span></div><a class="back" href="/">Main Website</a></div></header>
<section class="hero"><div class="container"><div class="eyebrow">Private Customer Shipment Room</div><h1>Your Shipment</h1><p>Secure shipment information for tracking number <span class="code" id="heroCode">Loading...</span></p><span class="status" id="heroStatus">Loading</span></div></section>
<main class="wrap"><div class="container" id="app"><div class="loading">Loading shipment information...</div></div></main>
<footer>© JESTILO Worldwide Delivery</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const code=new URLSearchParams(location.search).get('code');let shipmentMap=null;let layers=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=v=>{if(!v)return'-';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})};
function active(status,stage){const s=String(status||'').toLowerCase();if(stage===0)return true;if(stage===1)return /processing|transit|arrived|destination|out for delivery|delivered/.test(s);if(stage===2)return /transit|arrived|destination|out for delivery|delivered/.test(s);if(stage===3)return /arrived|destination|out for delivery|delivered/.test(s);if(stage===4)return /out for delivery|delivered/.test(s);return false}
function timeline(status){const a=['Shipment received','Processing','In transit','Destination','Delivered'];return '<div>'+a.map((x,i)=>'<div class="timeline-item"><div class="dot '+(active(status,i)?'active':'')+'"></div><div class="tltext"><strong>'+x+'</strong><span>'+((active(status,i))?'Completed/current stage':'Pending')+'</span></div></div>').join('')+'</div>'}
async function geocode(q){if(!q)return null;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const j=await r.json();if(!j[0])return null;return[Number(j[0].lat),Number(j[0].lon),j[0].display_name||q]}catch(e){return null}}
async function drawMap(s){const box=document.getElementById('mapBox');const st=document.getElementById('mapStatus');if(s.latitude==null||s.longitude==null||!Number.isFinite(Number(s.latitude))||!Number.isFinite(Number(s.longitude))){st.textContent='Shipment location is not currently available.';return}box.style.display='block';document.getElementById('mapOrigin').textContent=s.origin||'Origin not specified';document.getElementById('mapCurrent').textContent=s.location||'Current location';document.getElementById('mapDestination').textContent=s.destination||'Destination not specified';if(typeof L==='undefined'){st.textContent='Map could not load. Please refresh the page.';return}shipmentMap=L.map('shipmentMap',{zoomControl:true}).setView([Number(s.latitude),Number(s.longitude)],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(shipmentMap);const pts=[];const o=await geocode(s.origin),d=await geocode(s.destination);if(o){L.marker([o[0],o[1]]).addTo(shipmentMap).bindPopup('<strong>Shipment Origin</strong><br>'+esc(s.origin));pts.push([o[0],o[1]])}L.marker([Number(s.latitude),Number(s.longitude)]).addTo(shipmentMap).bindPopup('<strong>JESTILO Shipment</strong><br>'+esc(s.location||'Current shipment position'));pts.push([Number(s.latitude),Number(s.longitude)]);if(d){L.marker([d[0],d[1]]).addTo(shipmentMap).bindPopup('<strong>Shipment Destination</strong><br>'+esc(s.destination));pts.push([d[0],d[1]])}if(pts.length>1)L.polyline(pts,{weight:4,opacity:.85,dashArray:'10 8'}).addTo(shipmentMap);shipmentMap.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:12,animate:false});setTimeout(()=>shipmentMap.invalidateSize(true),300);st.textContent='Current shipment coordinates: '+Number(s.latitude).toFixed(5)+', '+Number(s.longitude).toFixed(5)+(o&&d?' • Origin and destination displayed.':'');}
function openImage(src){const v=document.createElement("div");v.style="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out";v.innerHTML=`<button style="position:absolute;top:16px;right:16px;width:42px;height:42px;border:0;border-radius:50%;font-size:25px;cursor:pointer">×</button><img src="${src}" style="max-width:96%;max-height:92%;object-fit:contain;border-radius:10px">`;v.onclick=e=>{if(e.target===v||e.target.tagName==="BUTTON")v.remove()};document.body.appendChild(v)}
async function load(){if(!code){document.getElementById('app').innerHTML='<div class="error">No tracking number was provided.</div>';return}try{const r=await fetch('/api/shipments/'+encodeURIComponent(code));if(!r.ok)throw new Error('Shipment not found');const s=await r.json();document.getElementById('heroCode').textContent=s.code||code;document.getElementById('heroStatus').textContent=s.status||'Shipment update';let mall=[];try{const mr=await fetch('/api/shipments/'+encodeURIComponent(code)+'/mall');if(mr.ok)mall=await mr.json()}catch(e){}const items=Array.isArray(mall)?mall:[];document.getElementById('app').innerHTML=`<div class="card"><h2>Shipment Overview</h2><div class="grid"><div class="info"><small>Tracking Number</small><strong>${esc(s.code)}</strong></div><div class="info"><small>Current Status</small><strong>${esc(s.status||'-')}</strong></div><div class="info"><small>Customer</small><strong>${esc(s.customer||'-')}</strong></div><div class="info"><small>Updated</small><strong>${esc(fmt(s.updated))}</strong></div><div class="info"><small>Origin</small><strong>${esc(s.origin||'-')}</strong></div><div class="info"><small>Destination</small><strong>${esc(s.destination||'-')}</strong></div><div class="info"><small>Current Location</small><strong>${esc(s.location||'-')}</strong></div><div class="info"><small>Estimated Delivery</small><strong>${esc(fmt(s.estimated_delivery))}</strong></div></div></div>${s.image_url?`<div class="card"><h2>Package</h2><p><strong>${esc(s.item_name||'Shipment')}</strong></p><p class="small">${esc(s.item_description||'')}</p><img class="package-img" src="${esc(s.image_url)}" alt="Package image" onclick="window.open(this.src,'_blank')"></div>`:''}${s.note?`<div class="card"><h2>Latest Shipment Update</h2><div class="update"><strong>${esc(fmt(s.updated))}</strong><p>${esc(s.note)}</p></div></div>`:''}<div class="card"><h2>Shipment Journey</h2>${timeline(s.status)}</div><div class="card mapbox" id="mapBox"><h2>Live Shipment Map</h2><div class="map-summary"><div class="point"><small>Origin</small><strong id="mapOrigin">-</strong></div><div class="arrow">→</div><div class="point"><small>Current</small><strong id="mapCurrent">-</strong></div><div class="arrow">→</div><div class="point"><small>Destination</small><strong id="mapDestination">-</strong></div></div><div id="shipmentMap"></div><div class="map-status" id="mapStatus">Loading shipment route...</div></div><div class="card"><h2>Purchased Items</h2><div id="items">${items.length?'<div class="items">'+items.map(i=>`<div class="item">${i.image_url?`<img src="${esc(i.image_url)}" alt="${esc(i.product_name||'Product')}" onclick="openImage(this.src)">`:''}<h3>${esc(i.product_name||'Purchased Item')}</h3><div class="price">${esc(i.currency||'USD')} ${esc(i.price||'0')}</div><p>Quantity: ${esc(i.quantity||1)}</p><p>Seller/Store: ${esc(i.seller||'-')}</p><p>Purchase date: ${esc(fmt(i.purchase_date))}</p><p>Status: <strong>${esc(i.purchase_status||'-')}</strong></p></div>`).join('')+'</div>':'<div class="empty">No purchased items have been added to this shipment.</div>'}</div></div><div class="card support"><h2 style="margin-bottom:8px">Customer Support</h2><div class="support-ticker"><span>✈️ Delivery service available&nbsp;&nbsp; • &nbsp;&nbsp;💬 Customer support is ready to assist&nbsp;&nbsp; • &nbsp;&nbsp;📦 Worldwide delivery updates</span></div><p class="small">Need help with this shipment?</p><a class="wa" href="https://wa.me/6285880761081" target="_blank" rel="noopener">WhatsApp Support</a><a class="mail" href="mailto:delightedinternationaldelivery@gmail.com">Email Support</a></div>`;await drawMap(s)}catch(e){document.getElementById('app').innerHTML='<div class="error">Unable to load this shipment. Please check the tracking number and try again.</div>';}}
load();window.addEventListener('resize',()=>shipmentMap&&shipmentMap.invalidateSize(true));
</script></body></html>
